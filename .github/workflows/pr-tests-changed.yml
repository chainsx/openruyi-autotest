# ============================================================
# PR 测试验证流水线
#
# 触发条件：
#   1. 有 PR 提交（open / synchronize / reopened）
#   2. PR 中 tests/ 目录下有文件改动
#
# 流程：
#   1. 检查 PR 中 tests/ 下改动的文件
#   2. 根据改动脚本涉及的测试元数据计算 VM 规格
#      （QEMU 数量、CPU、内存、网卡、磁盘）
#   3. 在 CloudPods 云平台创建 KVM 虚拟机，并在其中启动
#      openRuyi RISC-V QEMU 虚拟机（复用 create_server.py 逻辑）
#   4. 在 QEMU 中模拟手工测试方式执行被修改的脚本
#   5. 结果汇总并发布 PR 评论
#   6. 清理云平台虚拟机（无论成败）
#
# Runner: self-hosted (10.20.238.253, openruyi-github-runner)
# ============================================================
name: PR Tests Changed Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-tests-changed:
    # 仅在 PR 改动 tests/ 目录时运行
    if: ${{ github.event.pull_request }}
    runs-on: [self-hosted, Linux, X64, openEuler]
    timeout-minutes: 600
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORKSPACE: ${{ github.workspace }}
      CLOUDPODS_KEYSTONE_URL: ${{ secrets.CLOUDPODS_KEYSTONE_URL }}
      CLOUDPODS_USER: ${{ secrets.CLOUDPODS_USER }}
      CLOUDPODS_PASSWORD: ${{ secrets.CLOUDPODS_PASSWORD }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      # --------------------------------------------------------
      # 步骤 0：确保 runner 上有 paramiko（幂等）
      # --------------------------------------------------------
      - name: Ensure paramiko on runner
        run: |
          python3 -c "import paramiko" 2>/dev/null || \
            python3 -m pip install --user paramiko 2>&1 | tail -3

      # --------------------------------------------------------
      # 步骤 1：收集 tests/ 下改动的文件
      # --------------------------------------------------------
      - name: Get changed files under tests/
        id: changed
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- tests/ > changed_files.txt || true
          echo "Changed files under tests/:"
          cat changed_files.txt
          COUNT=$(wc -l < changed_files.txt)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          # 无改动时输出空，供后续步骤短路
          if [ "$COUNT" -eq 0 ]; then
            echo "No tests/ changes in this PR."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------------
      # 步骤 2：计算 VM 资源规格
      # --------------------------------------------------------
      - name: Compute VM requirements
        id: compute
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 .github/scripts/cli.py compute-requirements \
            --repo "$GITHUB_WORKSPACE" \
            --changed-files changed_files.txt \
            --output vm_requirements.json
          cat vm_requirements.json

      # --------------------------------------------------------
      # 步骤 3：创建 CloudPods 虚拟机 + 启动 QEMU
      # --------------------------------------------------------
      - name: Launch CloudPods hosts and QEMU VMs
        id: launch
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -o pipefail
          python3 .github/scripts/cli.py launch-qemu-env \
            --requirements vm_requirements.json \
            --output vm_info.json 2>&1 | tee launch.log
          echo "vm_info:"
          cat vm_info.json
        env:
          CLOUDPODS_KEYSTONE_URL: ${{ secrets.CLOUDPODS_KEYSTONE_URL }}
          CLOUDPODS_USER: ${{ secrets.CLOUDPODS_USER }}
          CLOUDPODS_PASSWORD: ${{ secrets.CLOUDPODS_PASSWORD }}

      # --------------------------------------------------------
      # 步骤 4：在 QEMU 中执行被修改的测试脚本
      # --------------------------------------------------------
      - name: Run tests in QEMU (simulate manual testing)
        id: run-tests
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -o pipefail
          python3 .github/scripts/cli.py run-tests-in-qemu \
            --vm-info vm_info.json \
            --repo "$GITHUB_WORKSPACE" \
            --requirements vm_requirements.json \
            --output test_results.json 2>&1 | tee run_tests.log
          echo "test_results:"
          cat test_results.json || true

      # --------------------------------------------------------
      # 步骤 5：发布 PR 评论（无论 Run tests 成败都执行）
      # --------------------------------------------------------
      - name: Post PR comment with results
        if: steps.changed.outputs.changed == 'true' && always()
        run: |
          if [ -f test_results.json ]; then
            python3 .github/scripts/cli.py post-pr-comment \
              --results test_results.json || true
          else
            echo "No test_results.json, skip comment"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # --------------------------------------------------------
      # 步骤 6：清理云平台虚拟机（总是执行）
      # --------------------------------------------------------
      - name: Cleanup CloudPods resources
        if: always()
        run: |
          if [ -f vm_info.json ]; then
            python3 .github/scripts/cli.py cleanup-cloudpods --vm-info vm_info.json || true
          else
            echo "No vm_info.json, skip cleanup"
          fi
        env:
          CLOUDPODS_KEYSTONE_URL: ${{ secrets.CLOUDPODS_KEYSTONE_URL }}
          CLOUDPODS_USER: ${{ secrets.CLOUDPODS_USER }}
          CLOUDPODS_PASSWORD: ${{ secrets.CLOUDPODS_PASSWORD }}
